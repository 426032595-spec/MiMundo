<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0612">
<style>html,body{margin:0}:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0a0612}</style><title>Bóveda de apuntes</title>
<style>
@font-face{font-family:'Unbounded';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/unbounded-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Unbounded';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/unbounded-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
</style>
<style>
/* Concepto: cada materia es una galaxia ilustrada. Las notas son planetas (los temas más conectados son estrellas), los [[enlaces]] son constelaciones y el panel es el cuaderno de bitácora. Nebulosa magenta y verde azulado sobre violeta casi negro. Diseño único y oscuro a propósito. */
:root{
  --bg:#0a0612; --surface:rgba(22,10,40,.88); --surface2:rgba(190,130,255,.13); --line:rgba(200,150,255,.22);
  --fg:#f6eeff; --muted:#a995cc; --accent:#ff7ac6; --accent-ink:#2a0618; --danger:#ff8a80;
  --f-display:'Unbounded','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
h1,h2,h3,h4{margin:0;font-family:var(--f-display)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.brand svg{color:var(--accent)}
.add{display:flex;gap:8px;flex:1 1 260px;min-width:0;max-width:460px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

input[type=text],input:not([type]),input[type=search]{height:38px;min-width:0;flex:1;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);color:var(--fg)}
input::placeholder,textarea::placeholder{color:var(--muted)}
button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-weight:600;font-size:13px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.small{height:30px;padding:0 10px;font-size:12px}
button.danger{background:var(--danger);color:var(--bg);border-color:transparent}

.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(12,6,24,.92)}
.tabrow{display:flex;gap:8px;overflow-x:auto;flex:1 1 320px;min-width:0;padding-block:2px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;height:34px;flex:none}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--sw);display:inline-block;box-shadow:0 0 10px var(--sw)}
.tab small{color:var(--muted);font:500 11px var(--f-mono)}
.tab.on{border-color:var(--accent);background:rgba(255,122,198,.15)}
.counts{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.tabs .small{flex:none}
.find{display:flex;flex:0 1 220px;min-width:140px}
.find input{height:34px}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:24px}
.empty div{max-width:360px;text-align:center;color:var(--muted)}
.empty h2{font-size:15px;font-weight:400;color:var(--fg);margin-bottom:8px}

.top{position:absolute;top:12px;left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.top>*{pointer-events:auto}
.banner{display:flex;align-items:center;gap:12px;max-width:560px;padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.banner button{height:30px;background:transparent;border-color:currentColor;color:inherit}
.toast{max-width:560px;padding:10px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:in .2s ease-out;margin-top:6px}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

#panel{position:absolute;z-index:10;right:0;top:0;bottom:0;width:360px;max-width:100%;overflow-y:auto;background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-left:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) 28px 16px}
@media (max-width:760px){
  #panel{top:auto;left:0;right:0;width:auto;max-height:64%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18)}
  .tabrow{flex-basis:100%}
  .find{flex:1 1 140px}
  .counts{display:none}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb i{width:9px;height:9px;border-radius:50%;background:var(--sw);flex:none}
.x{height:30px;width:30px;padding:0;font-size:18px;line-height:1}
#pTitle{font-family:var(--f-display);font-size:14px;font-weight:400;height:44px;width:100%}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{height:30px;font-size:12px;flex:1}
.seg button.on{border-color:var(--accent);color:var(--accent)}
#pBody{width:100%;min-height:200px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);padding:10px;font:13.5px/1.55 var(--f-mono);resize:vertical;color:var(--fg)}
.read{margin-top:10px;min-height:120px;padding:2px 0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.read p{margin:0 0 .7em}
.read h4{font-size:13px;font-weight:600;margin:1.1em 0 .4em;letter-spacing:.02em}
.read ul{margin:0 0 .8em;padding-left:1.2em}
.read code{font:12.5px var(--f-mono);background:var(--surface2);padding:1px 5px;border-radius:4px}
.wl{all:unset;cursor:pointer;color:var(--accent);border-bottom:1px solid rgba(255,122,198,.45)}
.wl:hover{border-bottom-color:var(--accent)}
.wl.un{color:var(--muted);border-bottom-style:dashed}
.wl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sec h3{display:flex;justify-content:space-between;align-items:baseline;font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec h3.sub{margin-top:8px}
.sec h3 small{font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.hint{margin:0;font-size:12px;color:var(--muted)}
.link{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px}
.link .go{flex:1;min-width:0;height:32px;text-align:left;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.link .un{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);padding:0;height:auto}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th+.rm,.gal .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;padding:0;border-radius:50%;background:rgba(10,5,20,.82);font-size:14px;line-height:1}
.cell{position:relative}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;padding:0;border-radius:50%;background:var(--sw);border:2px solid transparent}
.sw.on{outline:2px solid var(--fg);outline-offset:2px}
.danger-box{margin-top:14px;padding:12px;border:1px solid var(--danger);border-radius:10px}
.danger-box p{margin:0 0 10px}
.ghost-danger{margin-top:22px;width:100%;color:var(--danger);background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}

#dlg{position:absolute;inset:0;z-index:30;display:flex;padding:16px;background:rgba(8,4,16,.64);overflow:auto}
#dlg .card{margin:auto;width:100%;max-width:520px;background:rgba(20,9,36,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:20px;max-height:100%;overflow:auto;min-width:0}
#dlg .card.wide{max-width:900px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.dh h2{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fld>span{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .fld input{width:100%}
.card img.big{display:block;max-width:100%;max-height:78vh;margin:auto;border-radius:8px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.ac{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.ac button{display:flex;width:100%;height:32px;border:0;border-radius:0;justify-content:flex-start;align-items:center;background:transparent;font-weight:500}
.ac button.on{background:var(--surface2);color:var(--accent)}
.qs-list{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.qs-item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;height:38px;text-align:left;background:transparent;border-color:transparent;font-weight:500}
.qs-item span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.qs-item small{color:var(--muted);font:500 11px var(--f-mono);flex:none}
.qs-item.on{background:var(--surface2);border-color:var(--accent)}
.keys{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 18px;margin:10px 0 0;align-items:center}
.keys dt{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.keys dd{margin:0;color:var(--muted);font-size:13px}
kbd{font:500 12px var(--f-mono);padding:3px 8px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface2);color:var(--fg)}
.kh{margin:18px 0 0;font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.keyhint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:12px;z-index:5;font-size:11px;color:var(--muted);pointer-events:none}
@media (max-width:760px){.keyhint{display:none}}
.mbar{display:none}
@media (max-width:760px){
  .add,#btnFit,#btnKeys,.status,.find{display:none}
  .bar{padding-block:8px}
  .brand h1{font-size:13px}
  .tabs{padding-block:6px}
  .mbar{position:absolute;left:0;right:0;bottom:0;z-index:15;height:58px;display:flex;gap:8px;align-items:center;padding:0 max(10px,env(safe-area-inset-left,0px)) 0 max(10px,env(safe-area-inset-right,0px));background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .mbar button{flex:1;height:44px;font-size:13px;padding:0 6px}
  .mbar button:disabled{opacity:.4;cursor:not-allowed}
  #panel{bottom:58px;max-height:58%}
  #panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
  #dlg .card{padding:16px}
}
@media (pointer:coarse){
  button{height:44px}
  button.small{height:36px}
  .tab{height:40px}
  input[type=text],input:not([type]),input[type=search]{font-size:16px;height:44px}
  #pTitle{height:48px}
  .x{width:40px;height:40px}
  .sw{width:34px;height:34px}
  .link .go{height:40px}
  .seg button{height:36px}
  .gal .rm{width:32px;height:32px}
  .ac button{height:40px}
}
</style>
</head><body>
<header class="bar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="19" r="3.2"/><circle cx="14" cy="6" r="3.2"/><circle cx="21" cy="18" r="3.2"/><path d="M8 16.4 12 9M16.5 7.6 19.6 15M9.2 19.6h8.6" stroke-linecap="round"/></svg>
    <h1>Bóveda de apuntes</h1>
  </div>
  <form class="add" id="addForm" autocomplete="off">
    <input id="addTitle" type="text" maxlength="80" placeholder="Título de la nueva nota…" aria-label="Título de la nueva nota">
    <button class="primary" type="submit">Añadir nota</button>
  </form>
  <div class="tools">
    <button id="btnFit" type="button">Centrar</button>
    <button id="btnKeys" type="button" title="Atajos de teclado (?)">Atajos</button>
    <button id="btnBk" type="button" title="Exportar o importar una copia de todo">Respaldo</button>
    <span class="status" id="saveState" role="status"></span>
  </div>
</header>

<nav class="tabs" aria-label="Materias">
  <div class="tabrow" id="tabrow"></div>
  <button class="small" id="btnNewS" type="button">+ Materia</button>
  <button class="small" id="btnEditS" type="button">Editar materia</button>
  <span class="find"><input id="q" type="search" placeholder="Buscar en esta materia ( / )" aria-label="Buscar en esta materia"></span>
  <span class="counts" id="counts"></span>
</nav>

<main class="stage" id="stage">
  <canvas id="cv" role="img" aria-label="Mapa de notas de la materia. Arrastra para moverte, rueda o pellizca para acercar, toca una nota para abrirla, doble toque en un espacio vacío para crear una nota."></canvas>
  <div class="empty" id="empty" hidden><div><h2>Este rincón del cielo está vacío</h2><p>Escribe un título arriba y pulsa «Añadir nota», o toca dos veces el mapa para encender la primera estrella. Une notas escribiendo [[Título]] en el texto.</p></div></div>
  <div class="top"><div class="banner" id="banner" hidden><span id="bannerText"></span><button id="bannerCancel" type="button">Cancelar</button></div><div id="toasts" aria-live="polite"></div></div>
  <div class="keyhint">Pulsa <kbd>?</kbd> para ver los atajos · <kbd>Ctrl</kbd>+<kbd>K</kbd> para ir a una nota</div>
  <aside id="panel" hidden aria-label="Nota seleccionada"></aside>
  <div class="mbar"><button id="mbNote" type="button" class="primary">+ Nota</button><button id="mbSub" type="button" disabled>+ Subtema</button><button id="mbFind" type="button">Buscar</button><button id="mbFit" type="button">Centrar</button></div>
  <div id="dlg" hidden role="dialog" aria-modal="true" aria-label="Diálogo"><div class="card" id="dlgCard"></div></div>
</main>
<input id="fileImg" type="file" accept="image/*" multiple hidden>
<input id="fileImp" type="file" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
var KEY='boveda-apuntes-v1';
var $=function(s){return document.querySelector(s);};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var FONT="'Hanken Grotesk', system-ui, sans-serif";
var ACCENT='#ff7ac6';
var COLORS=[
  {id:'azul',n:'Azul niebla',c:'#8fa8ff'},{id:'ambar',n:'Ámbar',c:'#f0b255'},{id:'cian',n:'Cian',c:'#5fd8e8'},{id:'violeta',n:'Violeta',c:'#b69cff'},
  {id:'verde',n:'Verde musgo',c:'#7fd6a0'},{id:'rosa',n:'Rosa',c:'#ff9cc4'},{id:'coral',n:'Coral',c:'#ff9a85'},{id:'lima',n:'Lima',c:'#cfe86a'}
];
function colorOf(id){for(var i=0;i<COLORS.length;i++)if(COLORS[i].id===id)return COLORS[i];return COLORS[0];}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function short(t,n){t=String(t||'');n=n||28;return t.length>n?t.slice(0,n-1)+'…':t;}
function hex(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';}

/* ---------- datos de ejemplo ---------- */
function mk(t,body,x,y,color){return {id:uid(),t:t,body:body,x:x,y:y,color:color,imgs:[],links:[],created:Date.now(),updated:Date.now()};}
function ring(list,r){list.forEach(function(n,i){if(i===0){n.x=0;n.y=0;return;}var a=-Math.PI/2+(i-1)/(list.length-1)*Math.PI*2;n.x=Math.cos(a)*r;n.y=Math.sin(a)*r;});return list;}
function seed(){
  var civil=ring([
    mk('Derecho Civil','Ejemplo: estas notas son de muestra, edítalas o bórralas.\n\nTemas: [[Personas]], [[Bienes]], [[Obligaciones]], [[Contratos]].',0,0,'azul'),
    mk('Personas','Personas físicas y personas morales. Distingue la [[Capacidad]] de goce de la de ejercicio.',0,0,'azul'),
    mk('Capacidad','- Capacidad de goce: aptitud para ser titular de derechos y obligaciones.\n- Capacidad de ejercicio: aptitud para ejercerlos por sí mismo.\n\nVer [[Personas]].',0,0,'azul'),
    mk('Bienes','Clasificación de los bienes: muebles e inmuebles, fungibles y no fungibles. Se relacionan con los [[Contratos]].',0,0,'azul'),
    mk('Obligaciones','Vínculo jurídico entre acreedor y deudor. Fuentes frecuentes: contratos, hechos ilícitos y enriquecimiento ilegítimo. Ver [[Contratos]].',0,0,'azul'),
    mk('Contratos','Acuerdo de voluntades que crea o transfiere derechos y obligaciones.\n\n# Elementos\n- Existencia: consentimiento y objeto.\n- Validez: capacidad, ausencia de vicios, licitud y forma.\n\nVer [[Capacidad]].',0,0,'azul')
  ],150);
  var pi=ring([
    mk('Propiedad Intelectual','Ejemplo: se divide en [[Derecho de autor]] y [[Propiedad industrial]].',0,0,'violeta'),
    mk('Derecho de autor','Protege obras literarias y artísticas desde su creación. El registro ante el Indautor no es obligatorio. Incluye derechos morales y patrimoniales.',0,0,'violeta'),
    mk('Propiedad industrial','Protege signos distintivos e invenciones. Autoridad: IMPI. Ver [[Marcas]] y [[Patentes]].',0,0,'violeta'),
    mk('Marcas','Signos que distinguen productos o servicios. Se registran ante el IMPI. Ver [[Propiedad industrial]].',0,0,'violeta'),
    mk('Patentes','Protegen invenciones nuevas, con actividad inventiva y aplicación industrial. Ver [[Propiedad industrial]].',0,0,'violeta')
  ],140);
  var pen=ring([
    mk('Derecho Penal','Ejemplo: teoría del delito: [[Conducta]], [[Tipicidad]], [[Antijuridicidad]], [[Culpabilidad]].',0,0,'coral'),
    mk('Conducta','Acción u omisión voluntaria. Punto de partida de la teoría del delito. Sigue [[Tipicidad]].',0,0,'coral'),
    mk('Tipicidad','Adecuación de la conducta a la descripción de un tipo penal. Sigue [[Antijuridicidad]].',0,0,'coral'),
    mk('Antijuridicidad','Contradicción de la conducta típica con el orden jurídico. Las causas de justificación la excluyen, por ejemplo la legítima defensa. Sigue [[Culpabilidad]].',0,0,'coral'),
    mk('Culpabilidad','Reproche al autor por haber actuado contra el derecho pudiendo actuar de otro modo.',0,0,'coral')
  ],140);

function findByTitle(t){var k=t.trim().toLowerCase();return subj.notes.filter(function(n){return n.t.trim().toLowerCase()===k;})[0]||null;}
function createNote(t,x,y,near){
  if(subj.notes.length>=300){toast('La materia llegó al límite de 300 notas.');return null;}
  t=(t||'').trim()||'Nota nueva';
  if(typeof x!=='number'){
    var a=Math.random()*Math.PI*2;
    if(near){x=near.x+Math.cos(a)*90;y=near.y+Math.sin(a)*90;}else{x=Math.cos(a)*60;y=Math.sin(a)*60;}
  }
  var n=mk(t,'',x,y,near?near.color:subj.color);subj.notes.push(n);reindex();rebuild();alpha=Math.max(alpha,.7);posDirty=true;renderTabs();save();return n;
}
function uniq(base){var t=base,i=2;while(findByTitle(t))t=base+' '+(i++);return t;}
function createSub(p,title){
  var n=createNote(uniq(title||'Subtema'),undefined,undefined,p);if(!n)return null;
  var gp=p.parent?byId.get(p.parent):null,base=gp?Math.atan2(p.y-gp.y,p.x-gp.x):Math.random()*Math.PI*2,a=base+(Math.random()-.5)*2.2;

}

  var n=byId.get(id);if(!n)return;
  n.imgs.forEach(function(i){imgData.delete(i);imgEl.delete(i);idbDel(i);});

  subj.notes.forEach(function(x){x.links=x.links.filter(function(l){return l!==id;});if(x.parent===id)x.parent=n.parent||null;});
  reindex();rebuild();closePanel();renderTabs();alpha=Math.max(alpha,.4);posDirty=true;save();toast(n._kids&&n._kids.length?'Nota borrada. Sus subtemas subieron un nivel.':'Nota borrada.');

function handleConnect(t){
  var f=byId.get(connectFrom);if(!f||t.id===f.id)return;
  var i=f.links.indexOf(t.id),j=t.links.indexOf(f.id);
  if(i>=0||j>=0){if(i>=0)f.links.splice(i,1);if(j>=0)t.links.splice(j,1);toast('Enlace quitado.');}
  else if(t.parent===f.id||f.parent===t.id){toast('Ya están unidas como tema y subtema.');}

function renameLinks(oldT,newT){

function addImages(n,files){

function md(body){
  function inline(s){
    s=esc(s);
    s=s.replace(/\[\[([^\[\]|]+?)(?:\|([^\[\]]*))?\]\]/g,function(m,t,al){
      var tg=findByTitle(t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"));
      return '<button type="button" class="wl'+(tg?'':' un')+'" data-act="wl" data-t="'+t.trim()+'">'+(al&&al.trim()?al.trim():t.trim())+'</button>';
    });
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
    return s;
  }
  var out='',inList=false;
  body.split('\n').forEach(function(line){
    var li=/^\s*[-*]\s+(.*)$/.exec(line),h=/^#{1,3}\s+(.*)$/.exec(line);
    if(li){if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(li[1])+'</li>';return;}
    if(inList){out+='</ul>';inList=false;}
    if(h)out+='<h4>'+inline(h[1])+'</h4>';else if(line.trim())out+='<p>'+inline(line)+'</p>';
  });
  if(inList)out+='</ul>';
  return out;
}
